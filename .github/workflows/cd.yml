name: CD

# Se ejecuta cuando algo entra a main, que es la rama "de produccion".
# Compila la aplicacion y publica el binario como artefacto descargable.

on:
  push:
    branches: [main]

jobs:
  publicar:
    name: Compilar y publicar binario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Tests
        run: go test ./...

      - name: Compilar
        run: |
          mkdir -p dist
          GOOS=linux  GOARCH=amd64 go build -o dist/app-linux-amd64   ./cmd/...
          GOOS=darwin GOARCH=arm64 go build -o dist/app-darwin-arm64  ./cmd/...

      - uses: actions/upload-artifact@v4
        with:
          name: binarios
          path: dist/
