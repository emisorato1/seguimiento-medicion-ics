name: CD

# Se ejecuta cuando algo entra a main, que es la rama "de produccion".
# Compila la aplicacion y publica el binario como artefacto descargable.

on:
  push:
    branches: [main]

jobs:
  publicar:
    name: Compilar y publicar binario
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Tests
        run: go test ./...

      # Cada comando de cmd/ (la consola, la web) se compila por separado y con su nombre:
      # con mas de un main, "go build -o archivo ./cmd/..." falla.
      - name: Compilar
        run: |
          mkdir -p dist
          for carpeta in cmd/*/; do
            nombre=$(basename "$carpeta")
            GOOS=linux  GOARCH=amd64 go build -o "dist/$nombre-linux-amd64"  "./$carpeta"
            GOOS=darwin GOARCH=arm64 go build -o "dist/$nombre-darwin-arm64" "./$carpeta"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binarios
          path: dist/
