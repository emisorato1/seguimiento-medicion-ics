name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verificar:
    name: Formato, analisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Coherencia de las specs
        run: scripts/coherencia.sh

      - name: Formato (gofmt)
        run: |
          sin_formato=$(gofmt -l .)
          if [ -n "$sin_formato" ]; then
            echo "Estos archivos no estan formateados con gofmt:"
            echo "$sin_formato"
            exit 1
          fi

      - name: Analisis estatico (go vet)
        run: go vet ./...

      - name: Tests y cobertura
        run: |
          go test ./... -coverprofile=cobertura.out -covermode=count
          total=$(go tool cover -func=cobertura.out | tail -1 | awk '{print $3}')
          {
            echo "## Cobertura de tests"
            echo
            echo "**Total: $total**"
            echo
            echo '| Paquete | Cobertura |'
            echo '|---|---|'
            go tool cover -func=cobertura.out | grep -v '^total:' \
              | awk '{print $1}' | xargs -n1 dirname | sort -u \
              | while read -r paquete; do
                  pct=$(go tool cover -func=cobertura.out | grep "^$paquete/" \
                        | awk '{gsub("%","",$3); s+=$3; n++} END {if (n>0) printf "%.1f%%", s/n; else print "-"}')
                  echo "| $paquete | $pct |"
                done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Cobertura total: $total"

      - name: Guardar el reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: cobertura.out

  # Job aparte, y no una matriz del de arriba: la proteccion de dev exige exactamente el
  # chequeo "Formato, analisis y tests", y una matriz le cambiaria el nombre. Este job no es
  # obligatorio para mergear; existe porque parte del equipo trabaja en Windows y la
  # presentacion puede ser ahi (defecto #108).
  windows:
    name: Tests en Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Tests
        run: go test ./...

  # La web armada de punta a punta: se compila como en el CD, se abre con los datos de demo y
  # se piden sus paginas principales (scripts/prueba-humo.sh). Tampoco es obligatorio.
  humo:
    name: Prueba de humo de la web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Compilar la web
        run: CGO_ENABLED=0 go build -o web ./cmd/web

      - name: Prueba de humo
        run: scripts/prueba-humo.sh ./web
